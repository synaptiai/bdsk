name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Build validator
        run: bun run build

      - name: Verify dist is up to date
        run: |
          if [ -n "$(git diff --name-only dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'bun run build' and commit the output."
            git diff --stat dist/
            exit 1
          fi

      - name: Smoke test compiled validator
        run: node dist/cli.js . --format text --schemas-dir schemas --version

      - name: Run hook tests
        run: bash test/test-hooks.sh
