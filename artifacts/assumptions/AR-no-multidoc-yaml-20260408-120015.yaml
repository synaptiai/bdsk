kind: assumption_record
schema_version: "0.3"
id: AR-no-multidoc-yaml-20260408-120015
title: "Multi-document YAML files are not supported in v1"
status: accepted
owners:
  - daniel-bentes
created_at: "2026-04-08T12:00:15Z"
updated_at: "2026-04-08T12:00:15Z"
trace:
