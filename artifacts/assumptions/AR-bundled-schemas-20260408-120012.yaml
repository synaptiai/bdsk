metadata:
  impact_level: high
  area: architecture
spec:
  statement: >
    The validator will bundle the 12 kind-specific JSON Schema files plus
    common.json from this repository's schemas/ directory as its canonical
    schema definitions. These bundled schemas are the source of truth for V2
    validation. Users may override with --schemas-dir, but the defaults are
    the bundled copies.
  rationale: >
    The validator-spec section 5.2 states "JSON Schema definitions MUST be
    bundled with the validator." The schemas/ directory in this repository
    contains all 13 schema files. Bundling ensures the validator works
    without external dependencies and that schema versions are locked to
    the validator release.
  source_type: decision
  source_refs:
    - "validator-spec.md#5.2"
    - "schemas/"
  decision_authority: technical_authority
  review_by: "2026-05-08T12:00:00Z"
  resolution_rule: >
    Must be accepted before the build pipeline is configured. If the schemas
    diverge from the bundled copy at runtime, behavior is undefined — this
    assumption must be validated.
