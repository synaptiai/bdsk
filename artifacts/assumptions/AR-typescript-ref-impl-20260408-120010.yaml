spec:
  statement: >
    The reference validator implementation will be written in TypeScript.
    The validator-spec is language-agnostic in its interfaces and algorithms,
    but recommends TypeScript for its YAML/JSON parsing strengths, mature
    JSON Schema validation libraries (ajv), and precise type system.
    Python, Rust, or Go implementations following the same interfaces are
    equally valid.
  rationale: >
    The validator-spec section 2.1 recommends TypeScript. The existing project
    scaffold (package.json, tsconfig.json) is already TypeScript. Choosing a
    different language would require new project setup and would not align
    with the existing scaffold.
  source_type: decision
  source_refs:
    - "validator-spec.md#2.1"
  decision_authority: technical_authority
  review_by: "2026-05-08T12:00:00Z"
  resolution_rule: >
    Must be accepted before implementation begins. If rejected, the alternative
    language must be selected and the project scaffold must be regenerated.
