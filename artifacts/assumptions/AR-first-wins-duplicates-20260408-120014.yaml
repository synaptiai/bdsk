schema_version: "0.3"
id: AR-first-wins-duplicates-20260408-120014
title: "First-encountered artifact wins when duplicate IDs are found"
status: accepted
owners:
  - daniel-bentes
created_at: "2026-04-08T12:00:14Z"
updated_at: "2026-04-08T12:00:14Z"
trace:
