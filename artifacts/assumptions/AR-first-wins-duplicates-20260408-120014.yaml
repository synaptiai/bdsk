metadata:
  impact_level: medium
  area: product
spec:
  statement: >
    When V1 discovers two or more artifacts with the same ID, the
    first-encountered artifact (by filesystem scan order) is kept in the
    ArtifactIndex and all subsequent duplicates are skipped with a
    BDSK-SCHEMA-001 finding. The definition of "first encountered" depends
    on the filesystem's directory traversal order, which is not guaranteed
    to be deterministic across platforms.
  rationale: >
    The validator-spec section 5.1 step 2f states: "Keep the first-encountered
    artifact; skip the duplicate." This is a pragmatic choice to avoid
    ambiguity, but introduces a platform-dependent ordering concern.
    Deterministic output (section 1.4) requires consistent ordering.
  source_type: documented
  source_refs:
    - "validator-spec.md#5.1"
    - "validator-spec.md#1.4"
  decision_authority: product_authority
  review_by: "2026-05-08T12:00:00Z"
  resolution_rule: >
    Accept as documented, but the implementation must sort discovered files
    by path before processing to ensure deterministic behavior across
    platforms. This sorting is implied by the determinism requirement.
